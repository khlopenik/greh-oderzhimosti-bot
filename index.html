/* ---------- хранилище: общая база Supabase вместо локального браузера ----------
   Раньше данные лежали в IndexedDB прямо в браузере — правки видела только Люба
   на своём Маке. Теперь все читают/пишут одну и ту же базу в облаке, поэтому
   сайт и Telegram-бот показывают одно и то же. */
let DB={chars:[],stories:[],active:{st:1,se:'se1',ep:'e1'},nc:1,ns:2,nse:2,nep:2,nsc:1,nloc:1,ncast:1};

async function loadDB(){
 const {data:stories}=await sb.from('gr_stories').select('*').order('id');
 const out=[];
 for(const s of (stories||[])){
  const [{data:locs},{data:cast},{data:seasons}]=await Promise.all([
   sb.from('gr_locations').select('*').eq('story_id',s.id),
   sb.from('gr_cast').select('*').eq('story_id',s.id),
   sb.from('gr_seasons').select('*').eq('story_id',s.id).order('ord'),
  ]);
  const seasonsOut=[];
  for(const se of (seasons||[])){
   const {data:episodes}=await sb.from('gr_episodes').select('*').eq('season_id',se.id).order('ord');
   const episodesOut=[];
   for(const ep of (episodes||[])){
    const {data:scenes}=await sb.from('gr_scenes').select('*').eq('episode_id',ep.id).order('ord');
    const sceneIds=(scenes||[]).map(sc=>sc.id);
    let choicesByScene={};
    if(sceneIds.length){
     const {data:choices}=await sb.from('gr_choices').select('*').in('scene_id',sceneIds).order('ord');
     (choices||[]).forEach(c=>{(choicesByScene[c.scene_id]=choicesByScene[c.scene_id]||[]).push({t:c.txt,go:c.go,type:c.ctype,cost:c.cost})});
    }
    episodesOut.push({id:ep.id,title:ep.title,start:ep.start_scene,scenes:(scenes||[]).map(sc=>({
     id:sc.id,speaker:sc.speaker,illo:sc.illo,bg:sc.bg_url,loc:sc.loc_id,text:sc.scene_text,endnote:sc.endnote,
     choices:choicesByScene[sc.id]||[],
    }))});
   }
   seasonsOut.push({id:se.id,title:se.title,episodes:episodesOut});
  }
  out.push({
   id:s.id,title:s.title,genre:s.genre,cover:s.cover_url,desc:s.description,
   gg:{name:s.gg_name,desc:s.gg_desc},
   locations:(locs||[]).map(l=>({id:l.id,name:l.name,bg:l.bg_url})),
   cast:(cast||[]).map(c=>({id:c.id,name:c.name,img:c.img_url})),
   seasons:seasonsOut,
  });
 }
 DB.stories=out;
}

async function save(){
 try{
  for(const s of DB.stories){
   await sb.from('gr_stories').upsert({id:s.id,title:s.title,genre:s.genre,cover_url:s.cover,description:s.desc,gg_name:s.gg.name,gg_desc:s.gg.desc});
   await sb.from('gr_locations').delete().eq('story_id',s.id);
   if(s.locations.length)await sb.from('gr_locations').insert(s.locations.map(l=>({id:l.id,story_id:s.id,name:l.name,bg_url:l.bg})));
   await sb.from('gr_cast').delete().eq('story_id',s.id);
   if(s.cast.length)await sb.from('gr_cast').insert(s.cast.map(c=>({id:c.id,story_id:s.id,name:c.name,img_url:c.img})));

   const {data:oldSeasons}=await sb.from('gr_seasons').select('id').eq('story_id',s.id);
   const keepSe=s.seasons.map(se=>se.id);
   for(const os of (oldSeasons||[]))if(!keepSe.includes(os.id))await sb.from('gr_seasons').delete().eq('id',os.id);

   for(const [si,se] of s.seasons.entries()){
    await sb.from('gr_seasons').upsert({id:se.id,story_id:s.id,title:se.title,ord:si});

    const {data:oldEps}=await sb.from('gr_episodes').select('id').eq('season_id',se.id);
    const keepEp=se.episodes.map(ep=>ep.id);
    for(const oe of (oldEps||[]))if(!keepEp.includes(oe.id))await sb.from('gr_episodes').delete().eq('id',oe.id);

    for(const [ei,ep] of se.episodes.entries()){
     await sb.from('gr_episodes').upsert({id:ep.id,season_id:se.id,title:ep.title,start_scene:ep.start,ord:ei});

     const {data:oldScenes}=await sb.from('gr_scenes').select('id').eq('episode_id',ep.id);
     const keepSc=ep.scenes.map(sc=>sc.id);
     for(const osc of (oldScenes||[]))if(!keepSc.includes(osc.id))await sb.from('gr_scenes').delete().eq('id',osc.id);

     if(ep.scenes.length){
      await sb.from('gr_scenes').upsert(ep.scenes.map((sc,i)=>({id:sc.id,episode_id:ep.id,speaker:sc.speaker||null,illo:sc.illo||null,bg_url:sc.bg||null,loc_id:sc.loc||null,scene_text:sc.text,endnote:sc.endnote||null,ord:i})));
      const sceneIds=ep.scenes.map(sc=>sc.id);
      await sb.from('gr_choices').delete().in('scene_id',sceneIds);
      const choiceRows=[];
      ep.scenes.forEach(sc=>(sc.choices||[]).forEach((c,i)=>choiceRows.push({scene_id:sc.id,txt:c.t,go:c.go,ctype:c.type||'free',cost:c.cost||null,ord:i})));
      if(choiceRows.length)await sb.from('gr_choices').insert(choiceRows);
     }
    }
   }
  }
 }catch(e){console.error('save->supabase failed',e);alert('Не удалось сохранить в облако: '+(e&&e.message||e))}
}

/* картинка сразу загружается в Supabase Storage, возвращается публичная ссылка */
async function uploadImg(inp,cb){
 const f=inp.files[0];if(!f)return;
 const path=`uploads/${Date.now()}_${f.name.replace(/[^a-zA-Z0-9.\-]/g,'_')}`;
 const {error}=await sb.storage.from('gr-media').upload(path,f,{upsert:true});
 if(error){alert('Не удалось загрузить картинку: '+error.message);return}
 const {data}=sb.storage.from('gr-media').getPublicUrl(path);
 cb(data.publicUrl);
}

/* ================= АДМИНКА ================= */
let aTab='stories', nav={st:null,se:null,ep:null,sc:null}, cform=null, showNew=false;
const epCount=s=>s.seasons.reduce((a,se)=>a+se.episodes.length,0);
window.toggleNew=()=>{showNew=!showNew;renderAdmin()};

window.aSet=t=>{aTab=t;nav={st:null,se:null,ep:null,sc:null};if(t==='chars'&&!cform)cform={name:'',arch:'Холодный альфа',color:COLORS[0],look:'',first:''};renderAdmin()};

const nStory=()=>getStory(nav.st);

const nEp=()=>{const se=nSeason();return se&&se.episodes.find(x=>x.id===nav.ep)};

/* --- уровень 0: галерея историй --- */

window.createStory=()=>{

function locsBlock(s){

    <div class="rowbtns"><button class="btn sm ghost" onclick="goScene('${sc.id}')">Изменить</button>

window.goSeasonBack=()=>{nav.ep=null;renderAdmin()};
window.playEp=()=>{DB.active={st:nav.st,se:nav.se,ep:nav.ep};save();node=null;libraryOpen=false;setTab('story')};
window.addScene=()=>{const ep=nEp();const id='s'+(DB.nsc++);ep.scenes.push({id,speaker:'',illo:'',bg:null,text:'',choices:[]});if(!ep.start)ep.start=id;save();nav.sc=id;renderAdmin()};
window.goScene=id=>{nav.sc=id;renderAdmin()};
window.setStart=id=>{nEp().start=id;save();renderAdmin()};
window.rmScene=id=>{const ep=nEp();ep.scenes=ep.scenes.filter(x=>x.id!==id);if(ep.start===id)ep.start=ep.scenes[0]?ep.scenes[0].id:null;save();renderAdmin()};
function tgtLabel(go){if(go==='__chat')return 'чат с героем';if(go==='__restart')return 'заново';const sc=nEp().scenes.find(x=>x.id===go);return sc?('«'+(sc.text||sc.id).slice(0,14)+'…»'):'(?)'}

/* --- уровень 4: сцена --- */
function admScene(){
 const ep=nEp(),sc=nScene();
 const opts=`<option value="">— куда ведёт —</option>`+
  ep.scenes.filter(x=>x.id!==sc.id).map(x=>`<option value="${x.id}">«${esc((x.text||x.id).slice(0,20))}…»</option>`).join('')+
  `<option value="__chat">→ чат с героем</option><option value="__restart">→ заново</option>`;
 return `<div class="crumb">${esc(nStory().title)} › ${esc(nEp().title)} › <b>${sc.id}</b></div>
  <button class="btn sm ghost" onclick="backScene()">‹ К сценам</button>
  ${quickBar()}
  ${sc.bg?`<img class="thumb" src="${sc.bg}" style="margin-top:12px">`:''}
  <div class="field" style="margin-top:12px"><label>Локация (фон из библиотеки истории)</label><select id="e_loc"><option value="">— без локации —</option>${(nStory().locations||[]).map(l=>`<option value="${l.id}" ${sc.loc===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select></div>
  <div class="field"><label>Или своя картинка сцены (перебивает локацию)</label><input type="file" accept="image/*" onchange="upBg(this)">${sc.bg?'<div class="del" onclick="clrBg()" style="margin-top:6px">убрать картинку</div>':''}</div>
  <div class="field"><label>Описание арта (если фона нет)</label><input id="e_illo" value="${esc(sc.illo)}" placeholder="дождь, бар, взгляд альфы"></div>
  <div class="field"><label>Кто говорит (пусто = от автора)</label><input id="e_sp" value="${esc(sc.speaker)}" placeholder="Рэн / ??? / (пусто)"></div>
  <div class="field"><label>Текст сцены</label><textarea id="e_txt" placeholder="Что происходит…">${esc(sc.text)}</textarea></div>
  <div class="field"><label>Приписка в конце (напр. «Конец серии»)</label><input id="e_end" value="${esc(sc.endnote||'')}"></div>
  <div class="field"><label>Действия ГГ (выборы)</label>
   <div id="choices">${(sc.choices||[]).map((c,i)=>choiceRow(c,i,opts)).join('')}</div>
   <button class="btn sm ghost" onclick="addChoice()">+ добавить выбор</button></div>
  <button class="btn" onclick="saveScene()">Сохранить сцену</button>`;
}
function choiceRow(c,i,opts){
 return `<div class="choiceEdit">
  <input data-ci="${i}" data-k="t" value="${esc(c.t)}" placeholder="текст выбора / действие ГГ">
  <div class="two">
   <select data-ci="${i}" data-k="go">${opts.replace(`value="${c.go}"`,`value="${c.go}" selected`)}</select>
   <select data-ci="${i}" data-k="type"><option value="free" ${c.type!=='dia'?'selected':''}>Бесплатный</option><option value="dia" ${c.type==='dia'?'selected':''}>💎 Алмазный</option></select>
  </div>
  <input data-ci="${i}" data-k="cost" value="${c.cost||''}" placeholder="цена в 💎 (для алмазного)" inputmode="numeric">
  <div class="del" onclick="rmChoice(${i})">удалить выбор</div></div>`;
}
window.backScene=()=>{nav.sc=null;renderAdmin()};
window.upBg=inp=>uploadImg(inp,url=>{nScene().bg=url;save();renderAdmin()});
window.clrBg=()=>{nScene().bg=null;save();renderAdmin()};
window.addChoice=()=>{pullScene();nScene().choices.push({t:'',go:'',type:'free',cost:''});renderAdmin()};
window.rmChoice=i=>{pullScene();nScene().choices.splice(i,1);renderAdmin()};
function pullScene(){const sc=nScene();
 const g=id=>{const e=document.getElementById(id);return e?e.value:undefined};
 if(g('e_txt')!==undefined){sc.illo=g('e_illo');sc.speaker=g('e_sp');sc.text=g('e_txt');sc.endnote=g('e_end');if(g('e_loc')!==undefined)sc.loc=g('e_loc')}
 const rows={};document.querySelectorAll('[data-ci]').forEach(el=>{const i=el.dataset.ci;rows[i]=rows[i]||{t:'',go:'',type:'free',cost:''};rows[i][el.dataset.k]=el.value});
 const keys=Object.keys(rows);if(keys.length)sc.choices=keys.sort((a,b)=>a-b).map(k=>rows[k]);
}
window.saveScene=()=>{pullScene();const sc=nScene();sc.choices=(sc.choices||[]).filter(c=>c.t.trim());save();nav.sc=null;renderAdmin()};

/* --- герои --- */
function admChars(){
 return `<div class="note">Любовные интересы (не ГГ). Имя, типаж, внешность, первое сообщение.</div>
  <div class="field"><label>Имя</label><input id="f_name" value="${esc(cform.name)}" placeholder="Лео"></div>
  <div class="field"><label>Типаж</label><select id="f_arch">${ARCHS.map(a=>`<option ${cform.arch===a?'selected':''}>${a}</option>`).join('')}</select></div>
  <div class="field"><label>Внешность</label><textarea id="f_look" placeholder="Тёмные волосы, шрам…">${esc(cform.look)}</textarea></div>
  <div class="field"><label>Первое сообщение</label><textarea id="f_first" placeholder="Я думал о тебе…">${esc(cform.first)}</textarea></div>
  <button class="btn" onclick="addChar()">Добавить героя</button>
  <div style="font-size:13px;color:var(--muted);margin:20px 0 10px">Ровстер (${DB.chars.length})</div>
  ${DB.chars.map(c=>`<div class="guy">${ava(c)}<div style="flex:1"><div class="nm">${esc(c.name)}</div><div class="arch">${esc(c.arch)}</div></div><div class="del" onclick="delChar(${c.id})">удалить</div></div>`).join('')}`;
}
function bindAdmin(){
 const keep=(id,k)=>{const e=document.getElementById(id);if(e&&cform)e.oninput=()=>cform[k]=e.value};
 keep('f_name','name');keep('f_look','look');keep('f_first','first');
 const a=document.getElementById('f_arch');if(a&&cform)a.onchange=()=>cform.arch=a.value;
}
window.addChar=()=>{if(!cform.name.trim()){alert('Впиши имя');return}
 const c={id:DB.nc++,name:cform.name.trim(),arch:cform.arch,color:COLORS[DB.chars.length%COLORS.length],look:cform.look.trim()||'(не задано)',first:cform.first.trim()||'Привет…'};
 DB.chars.push(c);chats[c.id]=[{who:'in',text:c.first}];save();
 cform={name:'',arch:'Холодный альфа',color:COLORS[0],look:'',first:''};renderAdmin();
};
window.delChar=id=>{DB.chars=DB.chars.filter(c=>c.id!==id);delete chats[id];save();renderAdmin()};

/* утилиты */
function v(id){const e=document.getElementById(id);return e?e.value.trim():''}

async function bootDB(){
 try{
   const {data:{session}}=await sb.auth.getSession();
   authed=!!session;
 }catch(e){console.error('auth session check failed',e)}
 try{
   await loadDB();
   try{DB.progress=JSON.parse(localStorage.getItem('gr_progress'))||{}}catch(e){DB.progress={}}
 }catch(e){console.error('Не удалось загрузить базу из Supabase:',e)}
 initChats();
 render();
}
bootDB();

/* ---------- заставка загрузки ---------- */
(function(){
  const fill=document.getElementById('splashFill'), pctEl=document.getElementById('splashPct'),
        hintEl=document.getElementById('splashHint'), splash=document.getElementById('splash');
  const hints=["загружаем историю…","готовим локации…","знакомим с героями…","почти готово…"];
  let pct=0, hi=0;
  hintEl.textContent=hints[0];
  const hintTimer=setInterval(()=>{hi=(hi+1)%hints.length;hintEl.textContent=hints[hi]},550);
  const tick=setInterval(()=>{
    pct=Math.min(100,pct+(2+Math.random()*6));
    fill.style.width=pct+'%';
    pctEl.textContent=Math.floor(pct)+'%';
    if(pct>=100){
      clearInterval(tick);clearInterval(hintTimer);
      setTimeout(()=>{splash.classList.add('hide');setTimeout(()=>splash.remove(),550)},250);
    }
  },90);
})();
</script>
