<script>
(function(){
  // Telegram часто держит открытый WebView живым между заходами (просто скрывает/
  // показывает его через кнопку меню, не перезагружая страницу) — поэтому одной
  // проверки версии при загрузке недостаточно: перепроверяем при каждом возврате
  // видимости/фокуса и вдобавок раз в 20 секунд, пока апп открыт.
  var APP_VERSION='2026-08-10-10';
  var checking=false;
  function checkVersion(){
    if(checking)return;
    checking=true;
    fetch('version.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
      checking=false;
      if(d&&d.v&&d.v!==APP_VERSION){
        var u=new URL(location.href);
        u.searchParams.set('_v',d.v);
        location.replace(u.toString());
      }
    }).catch(function(){checking=false;});
  }
  try{
    checkVersion();
    document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')checkVersion();});
    window.addEventListener('focus',checkVersion);
    window.addEventListener('pageshow',checkVersion);
    setInterval(checkVersion,20000);
  }catch(e){}
})();
</script>

  /* Фигура внутри портрета стоит не по центру кадра, а примерно на 66% его ширины.
     Поэтому мало прижать саму картинку к краю — надо сдвинуть её так, чтобы на 33%/67%

/* ---------- хранилище: общая база Supabase вместо локального браузера ----------
   Раньше данные лежали в IndexedDB прямо в браузере — правки видела только Люба
   на своём Маке. Теперь все читают/пишут одну и ту же базу в облаке, поэтому
   сайт и Telegram-бот показывают одно и то же. */
let DB={chars:[],stories:[],active:{st:1,se:'se1',ep:'e1'},nc:1,ns:2,nse:2,nep:2,nsc:1,nloc:1,ncast:1};

async function loadDB(){
 const {data:stories}=await sb.from('gr_stories').select('*').order('id');
 const out=[];
 for(const s of (stories||[])){
  const [{data:locs},{data:cast},{data:seasons}]=await Promise.all([
   sb.from('gr_locations').select('*').eq('story_id',s.id),
   sb.from('gr_cast').select('*').eq('story_id',s.id),
   sb.from('gr_seasons').select('*').eq('story_id',s.id).order('ord'),
  ]);
  const seasonsOut=[];
  for(const se of (seasons||[])){
   const {data:episodes}=await sb.from('gr_episodes').select('*').eq('season_id',se.id).order('ord');
   const episodesOut=[];
   for(const ep of (episodes||[])){
    const {data:scenes}=await sb.from('gr_scenes').select('*').eq('episode_id',ep.id).order('ord');
    const sceneIds=(scenes||[]).map(sc=>sc.id);
    let choicesByScene={};
    if(sceneIds.length){
     const {data:choices}=await sb.from('gr_choices').select('*').in('scene_id',sceneIds).order('ord');
     (choices||[]).forEach(c=>{(choicesByScene[c.scene_id]=choicesByScene[c.scene_id]||[]).push({t:c.txt,go:c.go,type:c.ctype,cost:c.cost})});
    }
    episodesOut.push({id:ep.id,title:ep.title,start:ep.start_scene,scenes:(scenes||[]).map(sc=>({
     id:sc.id,speaker:sc.speaker,illo:sc.illo,bg:sc.bg_url,loc:sc.loc_id,text:sc.scene_text,endnote:sc.endnote,charPos:sc.char_pos||'',
     choices:choicesByScene[sc.id]||[],
    }))});
   }
   seasonsOut.push({id:se.id,title:se.title,nextDate:se.next_date||'',episodes:episodesOut});
  }
  out.push({
   id:s.id,title:s.title,genre:s.genre,cover:s.cover_url,previewBg:s.preview_bg_url,desc:s.description,
   gg:{name:s.gg_name,desc:s.gg_desc},
   locations:(locs||[]).map(l=>({id:l.id,name:l.name,bg:l.bg_url})),
   cast:(cast||[]).map(c=>({id:c.id,name:c.name,img:c.img_url,pos:c.pos||(c.gg?'left':'right')})),
   seasons:seasonsOut,
  });
 }
 DB.stories=out;
}

async function save(){
 try{
  for(const s of DB.stories){
   await sb.from('gr_stories').upsert({id:s.id,title:s.title,genre:s.genre,cover_url:s.cover,preview_bg_url:s.previewBg||null,description:s.desc,gg_name:s.gg.name,gg_desc:s.gg.desc});
   await sb.from('gr_locations').delete().eq('story_id',s.id);
   if(s.locations.length)await sb.from('gr_locations').insert(s.locations.map(l=>({id:l.id,story_id:s.id,name:l.name,bg_url:l.bg})));
   await sb.from('gr_cast').delete().eq('story_id',s.id);
   if(s.cast.length)await sb.from('gr_cast').insert(s.cast.map(c=>({id:c.id,story_id:s.id,name:c.name,img_url:c.img,pos:c.pos||'right'})));

   const {data:oldSeasons}=await sb.from('gr_seasons').select('id').eq('story_id',s.id);
   const keepSe=s.seasons.map(se=>se.id);
   for(const os of (oldSeasons||[]))if(!keepSe.includes(os.id))await sb.from('gr_seasons').delete().eq('id',os.id);

   for(const [si,se] of s.seasons.entries()){
    await sb.from('gr_seasons').upsert({id:se.id,story_id:s.id,title:se.title,next_date:se.nextDate||null,ord:si});

    const {data:oldEps}=await sb.from('gr_episodes').select('id').eq('season_id',se.id);
    const keepEp=se.episodes.map(ep=>ep.id);
    for(const oe of (oldEps||[]))if(!keepEp.includes(oe.id))await sb.from('gr_episodes').delete().eq('id',oe.id);

    for(const [ei,ep] of se.episodes.entries()){
     await sb.from('gr_episodes').upsert({id:ep.id,season_id:se.id,title:ep.title,start_scene:ep.start,ord:ei});

     const {data:oldScenes}=await sb.from('gr_scenes').select('id').eq('episode_id',ep.id);
     const keepSc=ep.scenes.map(sc=>sc.id);
     for(const osc of (oldScenes||[]))if(!keepSc.includes(osc.id))await sb.from('gr_scenes').delete().eq('id',osc.id);

     if(ep.scenes.length){
      await sb.from('gr_scenes').upsert(ep.scenes.map((sc,i)=>({id:sc.id,episode_id:ep.id,speaker:sc.speaker||null,illo:sc.illo||null,bg_url:sc.bg||null,loc_id:sc.loc||null,scene_text:sc.text,endnote:sc.endnote||null,char_pos:sc.charPos||null,ord:i})));
      const sceneIds=ep.scenes.map(sc=>sc.id);
      await sb.from('gr_choices').delete().in('scene_id',sceneIds);
      const choiceRows=[];
      ep.scenes.forEach(sc=>(sc.choices||[]).forEach((c,i)=>choiceRows.push({scene_id:sc.id,txt:c.t,go:c.go,ctype:c.type||'free',cost:c.cost||null,ord:i})));
      if(choiceRows.length)await sb.from('gr_choices').insert(choiceRows);
     }
    }
   }
  }
 }catch(e){console.error('save->supabase failed',e);alert('Не удалось сохранить в облако: '+(e&&e.message||e))}
}

/* картинка сразу загружается в Supabase Storage, возвращается публичная ссылка */
async function uploadImg(inp,cb){
 const f=inp.files[0];if(!f)return;
 const path=`uploads/${Date.now()}_${f.name.replace(/[^a-zA-Z0-9.\-]/g,'_')}`;
 const {error}=await sb.storage.from('gr-media').upload(path,f,{upsert:true});
 if(error){alert('Не удалось загрузить картинку: '+error.message);return}
 const {data}=sb.storage.from('gr-media').getPublicUrl(path);
 cb(data.publicUrl);
}
/* drag-n-drop поверх обычных input[type=file] в админке — перетащи файл прямо на поле */
window.onDropZone=ev=>{
 ev.preventDefault();
 const zone=ev.currentTarget;
 zone.classList.remove('dragover');
 const dt=ev.dataTransfer;
 if(!dt||!dt.files||!dt.files.length)return;
 const inp=zone.querySelector('input[type=file]');
 if(!inp)return;
 inp.files=dt.files;
 inp.dispatchEvent(new Event('change',{bubbles:true}));
};

 if(!ep||!ep.scenes.length){alert('В этой истории пока нет доступных серий.');return}
 DB.active={st:id,se:se.id,ep:ep.id};

};
window.libRestartEpisode=id=>{
 const s=getStory(id);
 const prog=DB.progress&&DB.progress[id];
 const se=(prog&&s.seasons.find(x=>x.id===prog.se))||s.seasons[0];
 const ep=(prog&&se&&se.episodes.find(x=>x.id===prog.ep))||(se&&se.episodes[0]);
 if(!se||!ep)return;
 DB.active={st:id,se:se.id,ep:ep.id};
 node=null;libraryOpen=false;saveProgress();render();
};
window.libRestartSeason=id=>{
 const s=getStory(id);

 DB.active={st:id,se:se.id,ep:se.episodes[0].id};

function nextEpisodeInfo(){
 const st=getStory(DB.active.st);
 const se=st&&st.seasons.find(x=>x.id===DB.active.se);
 if(!se)return null;
 const idx=se.episodes.findIndex(e=>e.id===DB.active.ep);
 const nxt=se.episodes[idx+1];
 return (nxt&&nxt.scenes.length)?{se:se.id,ep:nxt.id}:null;
}
window.continueStory=()=>{

function libPreviewCard(s){
 const prog=DB.progress&&DB.progress[s.id];
 const se=s.seasons[0];
 const total=se?se.episodes.length:0;
 let epNum=1;
 if(prog&&se){const i=se.episodes.findIndex(e=>e.id===prog.ep);if(i>=0)epNum=i+1}
 const ready=s.seasons.some(x=>x.episodes.some(e=>e.scenes.length));
 const genres=(s.genre||'').split('·').map(g=>g.trim()).filter(Boolean);
 const playBtns = (ready&&prog)
   ? `<button class="btn" onclick="libPlay(${s.id})">Продолжить</button>
      <button class="btn ghost" style="margin-top:8px" onclick="libRestartEpisode(${s.id})">Пройти серию ${epNum} заново</button>
      <button class="btn ghost" style="margin-top:8px" onclick="libRestartSeason(${s.id})">Пройти сезон заново</button>`
   : `<button class="btn" onclick="libPlay(${s.id})">${ready?'Играть':'Скоро'}</button>`;
 if(s.previewBg)return `<div class="libov" onclick="libPreviewClose()">
   <div class="libpv bgmode" onclick="event.stopPropagation()" style="background-image:url(${s.previewBg})">
     <div class="closex" onclick="libPreviewClose()">✕</div>
     <div class="body bgbody">
       <div class="epnum">Серия ${epNum}/${total>1?total:'X'} (Сезон 1)</div>
       ${genres.length?`<div class="genres">${genres.map(g=>`<span>${esc(g)}</span>`).join('')}</div>`:''}
       <div class="desc">${esc(s.desc||'')}</div>
       ${playBtns}
     </div>
   </div>
 </div>`;
 return `<div class="libov" onclick="libPreviewClose()">
   <div class="libpv" onclick="event.stopPropagation()">
     <div class="cover" style="background-image:url(${s.cover||''})"><div class="closex" onclick="libPreviewClose()">✕</div></div>
     <div class="body">
       <div class="epnum">Серия ${epNum}/${total>1?total:'X'} (Сезон 1)</div>
       ${genres.length?`<div class="genres">${genres.map(g=>`<span>${esc(g)}</span>`).join('')}</div>`:''}
       <div class="desc">${esc(s.desc||'')}</div>

 </div>`;
}

window.closeOverlay=()=>{overlay=null;render()};
window.resetEpisodeProgress=()=>{
 if(!confirm('Начать эту серию заново с самого начала?'))return;
 overlay=null;restartEpisode();
};
window.resetSeasonProgress=()=>{
 if(!confirm('Начать весь сезон заново с первой серии?'))return;
 overlay=null;restartSeason();
};
function overlayHTML(){
 if(overlay==='settings')return `<div class="vnoverlay" onclick="closeOverlay()"><div class="vnpanel" onclick="event.stopPropagation()">
   <div class="vnpanel-title">Настройки</div>
   <div class="vnchoice" onclick="resetEpisodeProgress()"><span>Пройти серию заново</span></div>
   <div class="vnchoice" onclick="resetSeasonProgress()"><span>Пройти сезон заново</span></div>
   <div class="vnchoice ghost" onclick="closeOverlay();libOpen()"><span>Вернуться в галерею</span></div>
   <div class="vnchoice ghost" onclick="closeOverlay()"><span>Закрыть</span></div>
 </div></div>`;
 if(overlay==='wardrobe')return `<div class="vnoverlay" onclick="closeOverlay()"><div class="vnpanel" onclick="event.stopPropagation()">
   <div class="vnpanel-title">Внешность</div>
   <div class="note">Скоро здесь можно будет менять причёску и наряд ГГ. Пока раздел в разработке.</div>
   <div class="vnchoice ghost" onclick="closeOverlay()"><span>Закрыть</span></div>
 </div></div>`;
 return '';
}
function renderStory(){
 if(libraryOpen)return renderLibrary();
 const ep=activeEp();
 if(!ep||!ep.scenes.length){screen.innerHTML='<div class="libback" onclick="libOpen()">‹ Библиотека</div><div class="note">Нет серий для игры. Собери в Админке и нажми «Играть».</div>';return}
 if(!node)node=ep.start||ep.scenes[0].id;
 const n=ep.scenes.find(s=>s.id===node)||ep.scenes[0];
 const st=getStory(DB.active.st);
 const loc=(n.loc&&st&&st.locations)?st.locations.find(l=>l.id===n.loc):null;
 const bgUrl=(loc&&loc.bg)?loc.bg:n.bg;
 const castMember=(n.speaker&&st&&st.cast)?st.cast.find(c=>c.name===n.speaker):null;

 const choices=n.choices||[];
 const idx=ep.scenes.findIndex(x=>x.id===n.id);
 const nextScene=ep.scenes[idx+1];
 const autoNext=choices.length===0&&nextScene;
 const tapThrough = (choices.length===1 && choices[0].t==='Далее') || autoNext;
 const tapTarget = choices.length===1 ? choices[0].go : (autoNext ? nextScene.id : null);

 let h=`<div class="vn${bgUrl?' hasbg':''}"${tapThrough?` onclick="goNode('${tapTarget}')"`:''}>`;
 if(bgUrl&&isVideoUrl(bgUrl))h+=`<video class="vnbg" src="${bgUrl}" autoplay loop muted playsinline></video>`;
 else if(bgUrl)h+=`<div class="vnbg" style="background-image:url(${bgUrl})"></div>`;
 h+=`<div class="vnback" onclick="event.stopPropagation();libOpen()">‹</div>`;
 h+=`<div class="vnicons">
   <div class="vnicon" onclick="event.stopPropagation();libOpen()" title="В галерею">🏠</div>
   <div class="vnicon" onclick="event.stopPropagation();openSettings()" title="Настройки">⚙️</div>
   <div class="vnicon" onclick="event.stopPropagation();openWardrobe()" title="Внешность">👗</div>
 </div>`;
 if(overlay)h+=overlayHTML();
 if(!bgUrl&&n.illo)h+=`<div class="vnnote">арт: ${esc(n.illo)}</div>`;
 const autoPos=(castMember&&castMember.pos)||'right';
 const finalPos=n.charPos||autoPos;
 if(finalPos!=='none'&&castMember&&castMember.img)h+=`<img class="vnchar pos-${finalPos}" src="${castMember.img}">`;
 h+=`<div class="vnfade"></div>`;

 h+=`<div class="vnui">`;
 if(n.text||n.speaker||n.endnote){
   h+=`<div class="vntab"><span>${n.speaker?esc(n.speaker):'…'}</span></div>`;
   h+=`<div class="vnbox"><div class="in"><div class="vntext">${esc(n.text)}</div>`;
   if(n.endnote)h+=`<div class="vnend">${esc(n.endnote)}</div>`;
   h+=`</div></div>`;
 }

 if(tapThrough){
   h+=`<div class="vntap">тронь экран, чтобы продолжить ›</div>`;
 } else if(!choices.length){
   h+=episodeEndHTML(st,ep);
 } else {
   choices.forEach(c=>{
    const act = c.go==='__restart' ? `restart()` : `goNode('${c.go}')`;
    const dia = c.type==='dia';
    h+=`<div class="vnchoice${dia?' dia':''}" onclick="event.stopPropagation();${act}"><span>${dia?`💎 ${c.cost||0} · `:''}${esc(c.t)}</span></div>`;
   });
 }
 h+=`</div></div>`;
 screen.innerHTML=h;screen.scrollTop=0;
 preloadUpcoming(ep,n,st,choices,tapTarget);
}
const preloadedUrls=new Set();
function preloadUrl(url){
 if(!url||preloadedUrls.has(url))return;
 preloadedUrls.add(url);
 const img=new Image();img.src=url;
}
function preloadUpcoming(ep,n,st,choices,tapTarget){
 const targets=tapTarget?[tapTarget]:choices.map(c=>c.go).filter(g=>g&&g!=='__restart');
 targets.forEach(id=>{
  const sc=ep.scenes.find(x=>x.id===id);
  if(!sc)return;
  const loc=(sc.loc&&st&&st.locations)?st.locations.find(l=>l.id===sc.loc):null;
  preloadUrl((loc&&loc.bg)?loc.bg:sc.bg);
  const cm=(sc.speaker&&st&&st.cast)?st.cast.find(c=>c.name===sc.speaker):null;
  if(cm)preloadUrl(cm.img);
 });
}
window.goNode=id=>{node=id;saveProgress();render()};
window.restart=()=>{node=activeEp().start;saveProgress();render()};
window.restartEpisode=()=>window.restart();
window.restartSeason=()=>{
 const st=getStory(DB.active.st);
 const se=st&&st.seasons.find(x=>x.id===DB.active.se);
 const firstEp=se&&se.episodes[0];
 if(!firstEp)return;
 DB.active.ep=firstEp.id;node=null;saveProgress();render();
};

/* ================= АДМИНКА ================= */
let nav={st:null,se:null,ep:null,sc:null}, showNew=false;
const epCount=s=>s.seasons.reduce((a,se)=>a+se.episodes.length,0);
window.toggleNew=()=>{showNew=!showNew;renderAdmin()};
function renderAdmin(){
 if(!authed){screen.innerHTML=admLogin();return}
 if(quickPanel){screen.innerHTML=admQuickPanel();return}
 screen.innerHTML=admStories()+
   `<button class="btn sm ghost" style="margin-top:24px" onclick="adminLogout()">Выйти из админки</button>`;
}
function admLogin(){
 return `<div class="note">Читать истории может кто угодно, а редактировать — только после входа.</div>
  <div class="field"><label>Email</label><input id="adm_email" type="email" placeholder="hlopenik.icon@gmail.com"></div>
  <div class="field"><label>Пароль</label><input id="adm_pass" type="password"></div>
  <button class="btn" onclick="adminLogin()">Войти</button>
  <div id="adm_err" style="color:#c0392b;font-size:13px;margin-top:8px"></div>`;
}
window.adminLogin=async()=>{
 const email=v('adm_email'),pass=document.getElementById('adm_pass').value;
 const {error}=await sb.auth.signInWithPassword({email,password:pass});
 if(error){document.getElementById('adm_err').textContent='Не вошло: '+error.message;return}
 authed=true;renderAdmin();
};
window.adminLogout=async()=>{await sb.auth.signOut();authed=false;renderAdmin()};

const nStory=()=>getStory(nav.st);
const nSeason=()=>{const s=nStory();return s&&s.seasons.find(x=>x.id===nav.se)};
const nEp=()=>{const se=nSeason();return se&&se.episodes.find(x=>x.id===nav.ep)};
const nScene=()=>{const e=nEp();return e&&e.scenes.find(x=>x.id===nav.sc)};

/* --- уровень 0: галерея историй --- */
function admStories(){
 if(nav.st)return admOneStory();
 const newForm=`<div class="card"><div class="body">
    <div class="ttl" style="margin-bottom:8px">Новая история</div>
    <div class="field"><label>Название</label><input id="ns_t" placeholder="Например, Тени города"></div>
    <div class="field"><label>Жанр (пишешь сам)</label><input id="ns_g" placeholder="яой · омегаверс · мистика"></div>
    <div class="field"><label>О чём история (коротко)</label><textarea id="ns_d" placeholder="Омега прячет свою природу, пока не встречает альфу…"></textarea></div>
    <div class="field"><label>Имя ГГ (за кого играют)</label><input id="ns_gg" placeholder="Юки"></div>
    <div class="field"><label>Описание ГГ</label><textarea id="ns_ggd" placeholder="Омега, 21 год, скрывает свою природу…"></textarea></div>
    <button class="btn" onclick="createStory()">Создать историю</button></div></div>`;
 return `<div class="note">Твоя галерея историй. Внутри каждой — сезоны, серии и сцены.</div>
  <button class="btn" onclick="toggleNew()">${showNew?'× Закрыть':'+ Добавить новую историю'}</button>
  ${showNew?newForm:''}
  <div style="font-size:13px;color:var(--muted);margin:16px 0 10px">Мои истории (${DB.stories.length})</div>
  ${DB.stories.map(s=>`<div class="card">
     <div class="cover" style="${s.cover?`background-image:url(${s.cover})`:''}"><span class="badge">${esc(s.genre||'без жанра')}</span></div>
     <div class="body"><div class="ttl">${esc(s.title)}</div>
       ${s.desc?`<div class="meta" style="margin-top:4px">${esc(s.desc)}</div>`:''}
       <div class="meta" style="margin-top:6px">ГГ: ${esc(s.gg?s.gg.name:'—')} · ${s.seasons.length} сезон(ов) · ${epCount(s)} серий</div>
       <div class="rowbtns"><button class="btn sm" onclick="playStory(${s.id})">Играть</button>
       <button class="btn sm ghost" onclick="goStory(${s.id})">Редактировать</button>
       <button class="btn sm ghost" onclick="rmStory(${s.id})">Удалить</button></div></div></div>`).join('')}`;
}
window.createStory=()=>{
 const t=v('ns_t');if(!t){alert('Впиши название');return}
 const st={id:DB.ns++,title:t,genre:v('ns_g'),desc:v('ns_d'),cover:null,gg:{name:v('ns_gg')||'ГГ',desc:v('ns_ggd')},locations:[],seasons:[]};
 DB.stories.push(st);save();showNew=false;nav.st=st.id;renderAdmin();
};
window.playStory=id=>{const s=getStory(id);const se=s.seasons[0];const ep=se&&se.episodes[0];if(!ep){alert('В истории нет серий. Добавь сезон и серию.');return}DB.active={st:id,se:se.id,ep:ep.id};save();node=null;libraryOpen=false;setTab('story')};
window.goStory=id=>{nav={st:id,se:null,ep:null,sc:null};renderAdmin()};
window.rmStory=id=>{if(confirm('Удалить историю?')){DB.stories=DB.stories.filter(s=>s.id!==id);save();renderAdmin()}};

/* --- уровень 1: история → ГГ + сезоны --- */
function locsBlock(s){
 return `<div style="font-size:13px;color:var(--muted);margin:20px 0 10px">Локации (${s.locations.length}) — фоны, которые переиспользуешь в сценах</div>
  ${s.locations.map(l=>`<div class="row">${l.bg?(isVideoUrl(l.bg)?`<video src="${l.bg}" muted style="width:46px;height:46px;object-fit:cover;border-radius:8px"></video>`:`<img src="${l.bg}" style="width:46px;height:46px;object-fit:cover;border-radius:8px">`):'<div style="width:46px;height:46px;border-radius:8px;background:var(--purple-soft)"></div>'}
    <div class="rt"><div>${esc(l.name)}</div><div class="m">${l.bg?'фон загружен':'нет фона'}</div></div>
    <label class="btn sm ghost dropzone" style="cursor:pointer;display:inline-block" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="onDropZone(event)">Фон<input type="file" accept="image/*,video/*" style="display:none" onchange="upLoc(this,'${l.id}')"></label>
    <span class="del" onclick="rmLoc('${l.id}')">✕</span></div>`).join('')}
  <div class="field" style="margin-top:8px"><input id="ns_loc" placeholder="Название локации (Бар ночью)"></div>
  <div class="field dropzone" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="onDropZone(event)"><label>Фото или видео локации (можно сразу, можно потом)</label><input type="file" id="ns_locfile" accept="image/*,video/*"><div class="dropzone-hint">или перетащи файл сюда</div></div>
  <button class="btn ghost" onclick="addLoc()">+ Добавить локацию</button>`;
}
function castBlock(s){
 const posLabel={left:'Слева',right:'Справа',center:'По центру',none:'Без портрета'};
 return `<div style="font-size:13px;color:var(--muted);margin:20px 0 10px">Действующие лица (${s.cast.length}) — портреты на прозрачном фоне, показываются поверх фона сцены, когда имя в поле «Кто говорит» совпадает с именем здесь. «По умолчанию» ниже — где стоит персонаж, если в самой сцене не выбрано иначе (в сцене можно переопределить)</div>
  ${s.cast.map(c=>`<div class="row">${c.img?`<img src="${c.img}" style="width:46px;height:46px;object-fit:cover;border-radius:8px">`:'<div style="width:46px;height:46px;border-radius:8px;background:var(--purple-soft)"></div>'}
    <div class="rt"><div>${esc(c.name)}</div><div class="m">По умолчанию: ${posLabel[c.pos||'right']}</div></div>
    <select onchange="setCastPos('${c.id}',this.value)" style="border-radius:8px;border:1px solid var(--line);padding:6px">
     <option value="left" ${(c.pos||'right')==='left'?'selected':''}>Слева</option>
     <option value="right" ${(c.pos||'right')==='right'?'selected':''}>Справа</option>
     <option value="center" ${c.pos==='center'?'selected':''}>Центр</option>
     <option value="none" ${c.pos==='none'?'selected':''}>Без портрета</option>
    </select>
    <label class="btn sm ghost dropzone" style="cursor:pointer;display:inline-block" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="onDropZone(event)">Портрет<input type="file" accept="image/*" style="display:none" onchange="upCast(this,'${c.id}')"></label>
    <span class="del" onclick="rmCast('${c.id}')">✕</span></div>`).join('')}
  <div class="field" style="margin-top:8px"><input id="ns_cast" placeholder="Имя персонажа (Итан) — как в поле «Кто говорит»"></div>
  <div class="field dropzone" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="onDropZone(event)"><label>Портрет (можно сразу, можно потом)</label><input type="file" id="ns_castfile" accept="image/*"><div class="dropzone-hint">или перетащи файл сюда</div></div>
  <button class="btn ghost" onclick="addCast()">+ Добавить персонажа</button>`;
}
let quickPanel=null;
window.quickOpen=view=>{if(nav.sc){try{pullScene()}catch(e){}}quickPanel=view;renderAdmin()};
window.quickClose=()=>{quickPanel=null;renderAdmin()};
function quickBar(){
 return `<div class="rowbtns" style="margin-bottom:14px">
   <button class="btn sm ghost" onclick="quickOpen('loc')">📍 Локации</button>
   <button class="btn sm ghost" onclick="quickOpen('cast')">🎭 Герои</button></div>`;
}
function admQuickPanel(){
 const s=nStory();
 if(!s.locations)s.locations=[];
 if(!s.cast)s.cast=[];
 return `<div class="crumb"><b>${esc(s.title)}</b> · ${quickPanel==='loc'?'Локации':'Действующие лица'}</div>
  <button class="btn sm ghost" onclick="quickClose()">‹ Назад, где была</button>
  ${quickPanel==='loc'?locsBlock(s):castBlock(s)}`;
}
function admOneStory(){
 if(nav.se)return admOneSeason();
 const s=nStory();
 if(!s.locations)s.locations=[];
 if(!s.cast)s.cast=[];
 return `<div class="crumb"><b>${esc(s.title)}</b></div>
  <button class="btn sm ghost" onclick="goStories()">‹ К галерее</button>
  ${s.cover?`<img class="thumb" src="${s.cover}" style="margin-top:12px">`:''}
  <div class="field dropzone" style="margin-top:12px" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="onDropZone(event)"><label>Обложка истории (карточка в галерее)</label><input type="file" accept="image/*" onchange="upCover(this)"><div class="dropzone-hint">или перетащи файл сюда</div></div>
  ${s.previewBg?`<img class="thumb" src="${s.previewBg}" style="margin-top:12px">`:''}
  <div class="field dropzone" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="onDropZone(event)"><label>Фон попапа-превью (с надписью сверху и пустым местом под текст снизу)</label><input type="file" accept="image/*" onchange="upPreviewBg(this)"><div class="dropzone-hint">или перетащи файл сюда</div></div>
  <div class="field"><label>Название</label><input id="e_t" value="${esc(s.title)}"></div>
  <div class="field"><label>Жанр</label><input id="e_g" value="${esc(s.genre)}"></div>
  <div class="field"><label>О чём история</label><textarea id="e_d">${esc(s.desc||'')}</textarea></div>
  <div class="field"><label>Имя ГГ</label><input id="e_gg" value="${esc(s.gg.name)}"></div>
  <div class="field"><label>Описание ГГ</label><textarea id="e_ggd">${esc(s.gg.desc)}</textarea></div>
  <button class="btn sm" onclick="saveStoryMeta()">Сохранить</button>
  ${locsBlock(s)}
  ${castBlock(s)}
  <div style="font-size:13px;color:var(--muted);margin:20px 0 10px">Сезоны (${s.seasons.length})</div>
  ${s.seasons.map(se=>`<div class="row"><div class="rt"><div>${esc(se.title)}</div><div class="m">${se.episodes.length} серий</div></div>
    <button class="btn sm ghost" onclick="goSeason('${se.id}')">Открыть</button>
    <span class="del" onclick="rmSeason('${se.id}')">✕</span></div>`).join('')}
  <div class="field" style="margin-top:10px"><input id="ns_se" placeholder="Название сезона (Сезон 1)"></div>
  <button class="btn" onclick="addSeason()">+ Добавить сезон</button>`;
}
window.goStories=()=>{nav.st=null;renderAdmin()};
window.saveStoryMeta=()=>{const s=nStory();s.title=v('e_t')||s.title;s.genre=v('e_g');s.desc=v('e_d');s.gg.name=v('e_gg')||'ГГ';s.gg.desc=v('e_ggd');save();renderAdmin()};
window.upCover=inp=>uploadImg(inp,url=>{nStory().cover=url;save();renderAdmin()});
window.upPreviewBg=inp=>uploadImg(inp,url=>{nStory().previewBg=url;save();renderAdmin()});
window.addLoc=()=>{
 const s=nStory();if(!s.locations)s.locations=[];
 DB.nloc=(DB.nloc||10)+1;
 const loc={id:'l'+DB.nloc,name:v('ns_loc')||('Локация '+(s.locations.length+1)),bg:null};
 s.locations.push(loc);
 const inp=document.getElementById('ns_locfile');
 if(inp&&inp.files[0])uploadImg(inp,url=>{loc.bg=url;save();renderAdmin()});
 else{save();renderAdmin()}
};
window.upLoc=(inp,id)=>uploadImg(inp,url=>{const l=nStory().locations.find(x=>x.id===id);if(l){l.bg=url;save();renderAdmin()}});
window.rmLoc=id=>{const s=nStory();s.locations=s.locations.filter(x=>x.id!==id);save();renderAdmin()};
window.addCast=()=>{
 const s=nStory();if(!s.cast)s.cast=[];
 const nm=v('ns_cast');if(!nm){alert('Впиши имя персонажа');return}
 DB.ncast=(DB.ncast||0)+1;
 const c={id:'c'+DB.ncast,name:nm,img:null};
 s.cast.push(c);
 const inp=document.getElementById('ns_castfile');
 if(inp&&inp.files[0])uploadImg(inp,url=>{c.img=url;save();renderAdmin()});
 else{save();renderAdmin()}
};
window.upCast=(inp,id)=>uploadImg(inp,url=>{const c=nStory().cast.find(x=>x.id===id);if(c){c.img=url;save();renderAdmin()}});
window.rmCast=id=>{const s=nStory();s.cast=s.cast.filter(x=>x.id!==id);save();renderAdmin()};
window.setCastPos=(id,pos)=>{const s=nStory();const c=s.cast.find(x=>x.id===id);if(c)c.pos=pos;save();renderAdmin()};
window.addSeason=()=>{const t=v('ns_se')||('Сезон '+(nStory().seasons.length+1));nStory().seasons.push({id:'se'+(DB.nse++),title:t,episodes:[]});save();renderAdmin()};
window.goSeason=id=>{nav.se=id;nav.ep=null;renderAdmin()};
window.rmSeason=id=>{if(confirm('Удалить сезон?')){const s=nStory();s.seasons=s.seasons.filter(x=>x.id!==id);save();renderAdmin()}};

/* --- уровень 2: сезон → серии --- */
function admOneSeason(){
 if(nav.ep)return admOneEpisode();
 const s=nStory(),se=nSeason();
 return `<div class="crumb"><b>${esc(s.title)}</b> › ${esc(se.title)}</div>
  <button class="btn sm ghost" onclick="goStoryBack()">‹ К сезонам</button>
  ${quickBar()}
  <div style="font-size:13px;color:var(--muted);margin:16px 0 10px">Серии (${se.episodes.length})</div>
  ${se.episodes.map(ep=>`<div class="row"><div class="rt"><div>${esc(ep.title)}</div><div class="m">${ep.scenes.length} сцен</div></div>
    <button class="btn sm ghost" onclick="goEp('${ep.id}')">Открыть</button>
    <span class="del" onclick="rmEp('${ep.id}')">✕</span></div>`).join('')}
  <div class="field" style="margin-top:10px"><input id="ns_ep" placeholder="Название серии (Серия 1. Знакомство)"></div>
  <button class="btn" onclick="addEp()">+ Добавить серию</button>
  <div class="field" style="margin-top:20px"><label>Дата выхода следующей серии (если её ещё нет — покажется игроку вместо «Продолжить»)</label>
   <input id="e_nextdate" value="${esc(se.nextDate||'')}" placeholder="напр. 20 августа" onchange="saveSeasonDate()"></div>`;
}
window.goStoryBack=()=>{nav.se=null;renderAdmin()};
window.addEp=()=>{const t=v('ns_ep')||('Серия '+(nSeason().episodes.length+1));nSeason().episodes.push({id:'e'+(DB.nep++),title:t,start:null,scenes:[]});save();renderAdmin()};
window.saveSeasonDate=()=>{nSeason().nextDate=v('e_nextdate');save()};
window.goEp=id=>{nav.ep=id;nav.sc=null;renderAdmin()};
window.rmEp=id=>{if(confirm('Удалить серию?')){const se=nSeason();se.episodes=se.episodes.filter(x=>x.id!==id);save();renderAdmin()}};

/* --- уровень 3: серия → сцены --- */
function admOneEpisode(){
 if(nav.sc)return admScene();
 const s=nStory(),se=nSeason(),ep=nEp();
 return `<div class="crumb"><b>${esc(s.title)}</b> › ${esc(se.title)} › ${esc(ep.title)}</div>
  <div class="rowbtns"><button class="btn sm ghost" onclick="goSeasonBack()">‹ К сериям</button>
   <button class="btn sm" onclick="playEp()">Играть серию</button></div>
  ${quickBar()}
  <div style="font-size:13px;color:var(--muted);margin:14px 0 10px">Сцены (${ep.scenes.length}) · старт: ${ep.start||'—'}</div>
  ${ep.scenes.map(sc=>`<div class="scard">
    <div class="lbl">${sc.id}${ep.start===sc.id?'<span class="startpill">старт</span>':''}${sc.speaker?' · '+esc(sc.speaker):''}${sc.bg?' · 🖼':''}</div>
    <div class="txt">${esc((sc.text||'').slice(0,80))}${(sc.text||'').length>80?'…':''}</div>
    <div class="ch">${(sc.choices||[]).map(c=>(c.type==='dia'?'💎 ':'▸ ')+esc(c.t)+' → '+tgtLabel(c.go)).join('<br>')||'— конец'}</div>
    <div class="rowbtns"><button class="btn sm ghost" onclick="goScene('${sc.id}')">Изменить</button>
     <button class="btn sm ghost" onclick="setStart('${sc.id}')">Старт</button>
     <button class="btn sm ghost" onclick="rmScene('${sc.id}')">Удалить</button></div>
    <button class="btn sm ghost" style="margin-top:8px;width:100%" onclick="insertSceneAfter('${sc.id}')">+ вставить сцену после этой</button></div>`).join('')}
  <button class="btn" style="margin-top:8px" onclick="addScene()">+ Добавить сцену</button>`;
}
window.goSeasonBack=()=>{nav.ep=null;renderAdmin()};
window.playEp=()=>{DB.active={st:nav.st,se:nav.se,ep:nav.ep};save();node=null;libraryOpen=false;setTab('story')};
window.addScene=()=>{const ep=nEp();const id='s'+(DB.nsc++);ep.scenes.push({id,speaker:'',illo:'',bg:null,text:'',choices:[]});if(!ep.start)ep.start=id;save();nav.sc=id;renderAdmin()};
function renumberScenes(ep){
 const remap={};
 ep.scenes.forEach((sc,i)=>{remap[sc.id]='s'+String(i+1).padStart(2,'0')});
 if(ep.start&&remap[ep.start])ep.start=remap[ep.start];
 ep.scenes.forEach(sc=>{(sc.choices||[]).forEach(c=>{if(c.go&&remap[c.go])c.go=remap[c.go]})});
 ep.scenes.forEach(sc=>{sc.id=remap[sc.id]});
}
window.insertSceneAfter=id=>{
 const ep=nEp();
 const idx=ep.scenes.findIndex(x=>x.id===id);
 const newScene={id:'tmpins'+Date.now(),speaker:'',illo:'',bg:null,text:'',choices:[]};
 ep.scenes.splice(idx+1,0,newScene);
 renumberScenes(ep);
 save();
 nav.sc=newScene.id;
 renderAdmin();
};
window.goScene=id=>{nav.sc=id;renderAdmin()};
window.setStart=id=>{nEp().start=id;save();renderAdmin()};
window.rmScene=id=>{const ep=nEp();ep.scenes=ep.scenes.filter(x=>x.id!==id);if(ep.start===id)ep.start=ep.scenes[0]?ep.scenes[0].id:null;renumberScenes(ep);save();renderAdmin()};
function tgtLabel(go){if(go==='__restart')return 'заново';const sc=nEp().scenes.find(x=>x.id===go);return sc?('«'+(sc.text||sc.id).slice(0,14)+'…»'):'(?)'}

/* --- уровень 4: сцена --- */
function admScene(){
 const ep=nEp(),sc=nScene();
 const opts=`<option value="">— куда ведёт —</option>`+
  ep.scenes.filter(x=>x.id!==sc.id).map(x=>`<option value="${x.id}">«${esc((x.text||x.id).slice(0,20))}…»</option>`).join('')+
  `<option value="__restart">→ заново</option>`;
 return `<div class="crumb">${esc(nStory().title)} › ${esc(nEp().title)} › <b>${sc.id}</b></div>
  <button class="btn sm ghost" onclick="backScene()">‹ К сценам</button>
  ${quickBar()}
  ${sc.bg?(isVideoUrl(sc.bg)?`<video class="thumb" src="${sc.bg}" muted style="margin-top:12px"></video>`:`<img class="thumb" src="${sc.bg}" style="margin-top:12px">`):''}
  <div class="field" style="margin-top:12px"><label>Локация (фон из библиотеки истории)</label><select id="e_loc"><option value="">— без локации —</option>${(nStory().locations||[]).map(l=>`<option value="${l.id}" ${sc.loc===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select></div>
  <div class="field dropzone" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="onDropZone(event)"><label>Или своя картинка/видео сцены (перебивает локацию)</label><input type="file" accept="image/*,video/*" onchange="upBg(this)"><div class="dropzone-hint">или перетащи файл сюда</div>${sc.bg?'<div class="del" onclick="clrBg()" style="margin-top:6px">убрать картинку/видео</div>':''}</div>
  <div class="field"><label>Описание арта (если фона нет)</label><input id="e_illo" value="${esc(sc.illo)}" placeholder="дождь, бар, взгляд альфы"></div>
  <div class="field"><label>Кто говорит (пусто = от автора)</label><input id="e_sp" value="${esc(sc.speaker)}" placeholder="Рэн / ??? / (пусто)"></div>
  <div class="field"><label>Портрет говорящего в этой сцене</label>
   <select id="e_charpos">
    <option value="" ${!sc.charPos?'selected':''}>Автоматически (как задано у персонажа)</option>
    <option value="left" ${sc.charPos==='left'?'selected':''}>Слева</option>
    <option value="right" ${sc.charPos==='right'?'selected':''}>Справа</option>
    <option value="center" ${sc.charPos==='center'?'selected':''}>По центру</option>
    <option value="none" ${sc.charPos==='none'?'selected':''}>Без портрета (только фон)</option>
   </select></div>
  <div class="field"><label>Текст сцены</label><textarea id="e_txt" placeholder="Что происходит…">${esc(sc.text)}</textarea></div>
  <div class="field"><label>Приписка в конце (напр. «Конец серии»)</label><input id="e_end" value="${esc(sc.endnote||'')}"></div>
  <div class="field"><label>Действия ГГ (выборы)</label>
   <div id="choices">${(sc.choices||[]).map((c,i)=>choiceRow(c,i,opts)).join('')}</div>
   <button class="btn sm ghost" onclick="addChoice()">+ добавить выбор</button></div>
  <button class="btn" onclick="saveScene()">Сохранить сцену</button>`;
}
function choiceRow(c,i,opts){
 return `<div class="choiceEdit">
  <input data-ci="${i}" data-k="t" value="${esc(c.t)}" placeholder="текст выбора / действие ГГ">
  <div class="two">
   <select data-ci="${i}" data-k="go">${opts.replace(`value="${c.go}"`,`value="${c.go}" selected`)}</select>
   <select data-ci="${i}" data-k="type"><option value="free" ${c.type!=='dia'?'selected':''}>Бесплатный</option><option value="dia" ${c.type==='dia'?'selected':''}>💎 Алмазный</option></select>
  </div>
  <input data-ci="${i}" data-k="cost" value="${c.cost||''}" placeholder="цена в 💎 (для алмазного)" inputmode="numeric">
  <div class="del" onclick="rmChoice(${i})">удалить выбор</div></div>`;
}
window.backScene=()=>{nav.sc=null;renderAdmin()};
window.upBg=inp=>uploadImg(inp,url=>{nScene().bg=url;save();renderAdmin()});
window.clrBg=()=>{nScene().bg=null;save();renderAdmin()};
window.addChoice=()=>{pullScene();nScene().choices.push({t:'',go:'',type:'free',cost:''});renderAdmin()};
window.rmChoice=i=>{pullScene();nScene().choices.splice(i,1);renderAdmin()};
function pullScene(){const sc=nScene();
 const g=id=>{const e=document.getElementById(id);return e?e.value:undefined};
 if(g('e_txt')!==undefined){sc.illo=g('e_illo');sc.speaker=g('e_sp');sc.text=g('e_txt');sc.endnote=g('e_end');if(g('e_loc')!==undefined)sc.loc=g('e_loc');const cpEl=document.getElementById('e_charpos');if(cpEl)sc.charPos=cpEl.value}
 const rows={};document.querySelectorAll('[data-ci]').forEach(el=>{const i=el.dataset.ci;rows[i]=rows[i]||{t:'',go:'',type:'free',cost:''};rows[i][el.dataset.k]=el.value});
 const keys=Object.keys(rows);if(keys.length)sc.choices=keys.sort((a,b)=>a-b).map(k=>rows[k]);
}
window.saveScene=()=>{pullScene();const sc=nScene();sc.choices=(sc.choices||[]).filter(c=>c.t.trim());save();nav.sc=null;renderAdmin()};


/* утилиты */
function v(id){const e=document.getElementById(id);return e?e.value.trim():''}

window.__dbReady=false;
window.__loadStage=5;
async function bootDB(){
 try{
   const {data:{session}}=await sb.auth.getSession();
   authed=!!session;
 }catch(e){console.error('auth session check failed',e)}
 window.__loadStage=30;
 try{
   await loadDB();
   window.__loadStage=85;
   try{DB.progress=JSON.parse(localStorage.getItem('gr_progress'))||{}}catch(e){DB.progress={}}
 }catch(e){console.error('Не удалось загрузить базу из Supabase:',e)}
 render();
 window.__loadStage=100;
 window.__dbReady=true;
}
bootDB();

/* ---------- заставка загрузки: сегменты-«колбочка» заполняются, не гаснет пока не загружено ---------- */
(function(){
  const hintEl=document.getElementById('splashHint'), splash=document.getElementById('splash'),
        segsEl=document.getElementById('splashSegs');
  const N=16;
  segsEl.innerHTML=Array.from({length:N}).map(()=>'<div class="seg"></div>').join('');
  const segs=segsEl.querySelectorAll('.seg');
  const hints=["загружаем историю…","готовим локации…","знакомим с героями…","почти готово…"];
  let pct=0, hi=0;
  hintEl.textContent=hints[0];
  const hintTimer=setInterval(()=>{hi=(hi+1)%hints.length;hintEl.textContent=hints[hi]},550);

  const tick=setInterval(()=>{
    const cap=window.__loadStage||5;
    pct=Math.min(cap,pct+(1+Math.random()*4));
    const lit=Math.round(pct/100*N);
    segs.forEach((s,i)=>s.classList.toggle('on',i<lit));

    if(window.__dbReady&&pct>=100){
      clearInterval(tick);clearInterval(hintTimer);
      setTimeout(()=>{splash.classList.add('hide');setTimeout(()=>splash.remove(),550)},250);
    }
  },90);
})();
</script>
